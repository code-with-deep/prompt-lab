services:
  - type: web
    name: prompt-playground-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://prompt-playground-frontend.onrender.com
    autoDeploy: true

  - type: web
    name: prompt-playground-frontend
    runtime: static
    staticPublishPath: frontend
    buildCommand: |
      echo "window.API_BASE = 'https://prompt-playground-backend.onrender.com/api';" > frontend/js/config.js
    routes:
      - type: rewrite
        source: /*
        destination: /index.html